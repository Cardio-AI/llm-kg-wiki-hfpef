<svg xmlns="http://www.w3.org/2000/svg" width="356" height="210" viewBox="0 0 356 210" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#94a3b8"/>
    </marker>
    <marker id="b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="356" height="210" fill="#fff"/>

  <!-- flow arrows -->
  <line x1="62" y1="95" x2="83" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="127" y1="95" x2="148" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="192" y1="95" x2="213" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="257" y1="95" x2="276" y2="95" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="296" y1="113" x2="296" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="296" y1="77" x2="296" y2="45" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2.5" marker-end="url(#b)"/>

  <!-- branch labels -->
  <text x="302" y="136" font-size="7.5" fill="#16a34a" font-weight="500">yes</text>
  <text x="302" y="65" font-size="7.5" fill="#b91c1c" font-weight="500">no</text>

  <!-- Node 1: aliases -->
  <circle cx="40" cy="95" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="29" y1="87" x2="40" y2="95" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="103" x2="40" y2="95" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="95" x2="52" y2="95" stroke="#475569" stroke-width="1.5" stroke-linecap="round" marker-end="url(#b)"/>
  <text x="40" y="126" text-anchor="middle" font-size="8" fill="#64748b">aliases</text>

  <!-- Node 2: cache check -->
  <circle cx="105" cy="95" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="103" cy="92" r="6.5" fill="none" stroke="#475569" stroke-width="1.5"/>
  <line x1="108" y1="97" x2="114" y2="103" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <text x="105" y="126" text-anchor="middle" font-size="8" fill="#64748b">cache</text>

  <!-- Node 3: read wiki -->
  <circle cx="170" cy="95" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="161" y="86" width="12" height="15" rx="1.5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="164" y="89" width="12" height="15" rx="1.5" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <line x1="167" y1="93.5" x2="173.5" y2="93.5" stroke="#475569" stroke-width="1"/>
  <line x1="167" y1="97" x2="174.5" y2="97" stroke="#475569" stroke-width="1"/>
  <line x1="167" y1="100.5" x2="172" y2="100.5" stroke="#475569" stroke-width="1"/>
  <text x="170" y="126" text-anchor="middle" font-size="8" fill="#64748b">read wiki</text>

  <!-- Node 4: synthesise -->
  <circle cx="235" cy="95" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="235" y1="85" x2="235" y2="105" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="225" y1="95" x2="245" y2="95" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="228" y1="88" x2="242" y2="102" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="242" y1="88" x2="228" y2="102" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <text x="235" y="126" text-anchor="middle" font-size="8" fill="#64748b">synthesise</text>

  <!-- Decision diamond -->
  <polygon points="296,77 316,95 296,113 276,95" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="296" y="91" text-anchor="middle" font-size="7" fill="#92400e" font-weight="600">evidence</text>
  <text x="296" y="102" text-anchor="middle" font-size="7" fill="#92400e" font-weight="600">ok?</text>

  <!-- YES: queries/ -->
  <rect x="268" y="155" width="56" height="28" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="296" y="166" text-anchor="middle" font-size="7.5" fill="#166534" font-weight="600">queries/</text>
  <text x="296" y="177" text-anchor="middle" font-size="7" fill="#166534">save page</text>

  <!-- NO: inbox/ -->
  <rect x="268" y="17" width="56" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="296" y="28" text-anchor="middle" font-size="7.5" fill="#991b1b" font-weight="600">inbox/</text>
  <text x="296" y="39" text-anchor="middle" font-size="7" fill="#991b1b">open question</text>

</svg>
